name: Improbable
description: |-
  Improbable (Improbable Worlds Ltd) is a London-based technology company and venture builder. Founded
  in 2012, it originally built SpatialOS, a distributed simulation and networking platform for large-scale
  real-time multiplayer games, and later Morpheus / M² (MSquared), a network of interoperable metaverse
  worlds. Today Improbable operates primarily as a venture builder and capital allocator, partnering with
  founders to launch and scale companies across AI, Web3 and the metaverse. It is backed by Andreessen
  Horowitz (a16z) and the SoftBank Vision Fund. Its historical developer surface centered on the SpatialOS
  Platform SDK, Worker SDK and the `spatial` CLI (distributed via NuGet), plus the improbable-eng and
  spatialos GitHub organizations; the standalone documentation, status and IMS subdomains have since been
  retired as the company pivoted away from a standalone developer platform.
